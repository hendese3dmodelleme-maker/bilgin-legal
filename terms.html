  <style>
    :root {
      --bg: #091a18;
      --card: #0f2b26;
      --primary: #36e2ca;
      --text: #e2f1ef;
      --muted: #8bb7ae;
      --border: #1a453d;
      --gold: #e8c96a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      padding: 24px 16px;
    }
    .container {
      max-width: 780px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .lang-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      flex-wrap: wrap;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .lang-btn {
      background: rgba(54, 226, 202, 0.08);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s;
    }
    .lang-btn:hover {
      background: rgba(54, 226, 202, 0.2);
      border-color: var(--primary);
    }
    .lang-btn.active {
      background: var(--primary);
      color: #091a18;
      border-color: var(--primary);
    }
    .badge {
      display: inline-block;
      background: rgba(54, 226, 202, 0.15);
      color: var(--primary);
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 26px;
      color: #fff;
      margin-bottom: 12px;
      line-height: 1.3;
    }
    .subtitle {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }
    .banner {
      background: rgba(54, 226, 202, 0.08);
      border: 1px solid rgba(54, 226, 202, 0.25);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 28px;
      font-size: 14px;
      color: #fff;
    }
    .warning-box {
      background: rgba(232, 201, 106, 0.08);
      border: 1px solid rgba(232, 201, 106, 0.3);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 28px;
      font-size: 13.5px;
      color: var(--gold);
      line-height: 1.6;
    }
    h2 {
      font-size: 18px;
      color: var(--primary);
      margin: 24px 0 10px;
    }
    ul {
      padding-inline-start: 22px;
      font-size: 14px;
      margin-bottom: 14px;
    }
    li {
      margin-bottom: 8px;
    }
    .contact {
      margin-top: 32px;
      padding: 20px;
      background: rgba(232, 201, 106, 0.08);
      border: 1px solid rgba(232, 201, 106, 0.25);
      border-radius: 14px;
      font-size: 14px;
    }
    .contact h3 {
      color: var(--gold);
      font-size: 16px;
      margin-bottom: 8px;
    }
    .contact a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
    .footer {
      margin-top: 32px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }

  <script>
    const allDocs = JSON.parse(document.getElementById('data-docs').textContent);

    function selectLang(code) {
      const doc = allDocs[code] || allDocs['tr'];
      if (!doc) return;

      document.documentElement.lang = doc.lang;
      document.documentElement.dir = doc.dir || 'ltr';

      // Update URL query parameter without full reload
      if (window.history && window.history.replaceState) {
        const url = new URL(window.location);
        url.searchParams.set('lang', code);
        window.history.replaceState({}, '', url);
      }

      // Update button active state
      document.querySelectorAll('.lang-btn').forEach(btn => {
        if (btn.getAttribute('onclick').includes("'" + code + "'")) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      // Render content
      let sectionsHtml = '';
      if (doc.sections) {
        sectionsHtml = doc.sections.map(s => {
          const items = s.items.map(i => '<li>' + i + '</li>').join('');
          return '<h2>' + s.h + '</h2><ul>' + items + '</ul>';
        }).join('');
      }

      let warningHtml = '';
      if (doc.warning) {
        warningHtml = '<div class="warning-box">' + doc.warning + '</div>';
      }

      const html = 
        '<div class="badge">' + doc.badge + '</div>' +
        '<h1>' + doc.title + '</h1>' +
        '<div class="subtitle">' + doc.updated + '</div>' +
        '<div class="banner">' + doc.banner + '</div>' +
        warningHtml +
        sectionsHtml +
        '<div class="contact">' +
          '<h3>' + (doc.contactTitle || '📬 İletişim') + '</h3>' +
          '<p>' + (doc.contactText || '') + '</p>' +
          '<p><a href="mailto:hendese3dmodelleme@gmail.com">hendese3dmodelleme@gmail.com</a></p>' +
        '</div>' +
        '<div class="footer">' + (doc.footer || '') + '</div>';

      document.getElementById('content-area').innerHTML = html;
    }

    // Determine initial language from ?lang= or navigator.language
    const urlParams = new URLSearchParams(window.location.search);
    let initialLang = (urlParams.get('lang') || '').toLowerCase().slice(0, 2);
    if (!allDocs[initialLang]) {
      const navLang = (navigator.language || 'tr').toLowerCase().slice(0, 2);
      initialLang = allDocs[navLang] ? navLang : 'tr';
    }

    selectLang(initialLang);
  </script>
